<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进度看板 - TeamMatch</title>
<link rel="stylesheet" href="lib/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-info"><div class="container">
  <a class="navbar-brand" href="index.html">TeamMatch</a>
  <span class="navbar-text text-white ml-3">进度看板</span>
  <div class="ml-auto" id="nav-user-info">
    <a class="btn btn-outline-light btn-sm" href="login.html">登录</a>
  </div>
</div></nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>项目进度</h4>
    <div>
      <a class="btn btn-outline-secondary btn-sm mr-2" id="backLink" href="project.html">返回项目</a>
      <button class="btn btn-primary btn-sm" id="addBtn" onclick="$('#addProgressForm').toggle()">+ 新增节点</button>
    </div>
  </div>

  <div class="card mb-3" id="addProgressForm" style="display:none">
    <div class="card-body">
      <h6>新增进度节点</h6>
      <div class="form-row">
        <div class="col-md-5"><input type="text" class="form-control mb-2" id="newTitle" placeholder="节点标题 *"></div>
        <div class="col-md-3"><input type="date" class="form-control mb-2" id="newDeadline"></div>
        <div class="col-md-4">
          <button class="btn btn-success btn-sm mr-2" id="saveProgress">保存</button>
          <button class="btn btn-secondary btn-sm" onclick="$('#addProgressForm').hide()">取消</button>
        </div>
      </div>
      <textarea class="form-control mt-2" id="newDesc" rows="2" placeholder="描述（选填）"></textarea>
    </div>
  </div>

  <div id="loading" class="text-center py-5"><div class="spinner-border text-info"></div></div>
  <div id="emptyState" class="empty-state" style="display:none">
    <div style="font-size:3rem">📝</div><p>暂无进度节点，组长可以添加里程碑</p>
  </div>
  <div id="progressList"></div>
</div>

<script src="lib/jquery.min.js"></script>
<script src="js/api.js"></script>
<script>
(function() {
  'use strict';
  if (typeof $ === 'undefined' || typeof window.TeamMatch === 'undefined') {
    document.getElementById('loading').innerHTML = '<p class="text-danger">页面资源加载失败，请刷新重试</p><button class="btn btn-primary btn-sm mt-2" onclick="location.reload()">刷新</button>';
    return;
  }

  var user = TeamMatch.util.getUser();
  if (!user) { location.href = 'login.html'; return; }
  var pid = new URLSearchParams(location.search).get('pid');
  if (!pid) { document.getElementById('loading').innerHTML = '<p class="text-danger">缺少项目ID</p>'; return; }

  $(function() {
    $('#nav-user-info').html('<span class="navbar-text mr-3 text-white">' + user.nickname + '</span>' +
      '<a class="btn btn-outline-light btn-sm" href="index.html">首页</a>');
    $('#backLink').attr('href', 'project.html?pid=' + pid);
    loadProgress();
  });

  async function loadProgress() {
    try {
      var res = await TeamMatch.projectApi.getProgress(pid);
      $('#loading').hide();
      if (res.code === 200) {
        if (!res.data || res.data.length === 0) { $('#emptyState').show(); return; }
        renderProgress(res.data);
      } else {
        $('#loading').html('<p class="text-danger">加载失败: ' + (res.message || '') + '</p><button class="btn btn-outline-primary btn-sm mt-2" onclick="loadProgress()">重试</button>');
      }
    } catch (e) {
      console.error(e);
      $('#loading').html('<p class="text-danger">' + (e.message || '加载失败') + '</p><button class="btn btn-outline-primary btn-sm mt-2" onclick="loadProgress()">重试</button>');
    }
  }

function renderProgress(list) {
  var html = '';
  var done = list.filter(function(p) { return p.status == 1; }).length;
  var total = list.length;
  var pct = total > 0 ? Math.round(done / total * 100) : 0;

  html += '<div class="mb-3"><small>整体进度: ' + done + '/' + total + '</small>' +
    '<div class="progress" style="height:8px"><div class="progress-bar bg-success" style="width:' + pct + '%"></div></div></div>';

  // 客户端按截止日期升序排序，无截止日期的节点排到末尾
  list.sort(function(a, b) {
    if (!a.deadline && !b.deadline) return 0;
    if (!a.deadline) return 1;
    if (!b.deadline) return -1;
    return a.deadline < b.deadline ? -1 : (a.deadline > b.deadline ? 1 : 0);
  });

  list.forEach(function(p) {
    var isDone = p.status == 1;
    html += '<div class="progress-item' + (isDone ? ' done' : '') + '" id="pr-' + p.prid + '">' +
      '<div class="d-flex justify-content-between align-items-center">' +
      '<div><strong class="progress-title">' + p.title + '</strong>' +
      (p.description ? '<br><small class="text-muted">' + p.description + '</small>' : '') + '</div>' +
      '<div class="text-right">' +
      (p.deadline ? '<small class="text-muted mr-3">' + p.deadline + '</small>' : '') +
      (isDone ? '<span class="badge badge-success">已完成</span>' :
        '<button class="btn btn-sm btn-outline-success btn-done" data-prid="' + p.prid + '">标记完成</button>') +
      '</div></div></div>';
  });
  $('#progressList').html(html);
}

$(document).on('click', '.btn-done', async function() {
  var prid = $(this).data('prid');
  try {
    var res = await TeamMatch.projectApi.updateProgress(pid, { prid: prid, status: 1 });
    if (res.code === 200) {
      TeamMatch.util.showToast('已标记完成', 'success');
      loadProgress();
    } else { TeamMatch.util.showToast(res.message, 'error'); }
  } catch (e) { TeamMatch.util.showToast('操作失败', 'error'); }
});

$('#saveProgress').click(async function() {
  var title = $('#newTitle').val().trim();
  if (!title) { TeamMatch.util.showToast('请输入节点标题', 'error'); return; }
  var data = { title: title };
  var desc = $('#newDesc').val().trim();
  if (desc) data.description = desc;
  var deadline = $('#newDeadline').val();
  if (deadline) data.deadline = deadline;

  try {
    var res = await TeamMatch.projectApi.addProgress(pid, data);
    if (res.code === 200) {
      TeamMatch.util.showToast('节点新增成功', 'success');
      $('#addProgressForm').hide();
      $('#newTitle, #newDesc').val('');
      loadProgress();
    } else { TeamMatch.util.showToast(res.message, 'error'); }
  } catch (e) { TeamMatch.util.showToast('操作失败', 'error'); }
});
})();
</script>
</body>
</html>
