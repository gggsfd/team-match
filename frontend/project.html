<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目详情 - TeamMatch</title>
<!-- ★ 性能优化：关键资源预加载 -->
<link rel="preload" href="lib/bootstrap.min.css" as="style">
<link rel="preload" href="js/api.js" as="script">
<link rel="stylesheet" href="lib/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<script>
  // 全局错误捕获与加载超时保护
  window._pageErrors = [];
  window.addEventListener('error', function(e) {
    window._pageErrors.push({type:'error', message:e.message, source:e.filename});
    console.error('[PageError]', e.message, e.filename);
  });
  window.addEventListener('unhandledrejection', function(e) {
    window._pageErrors.push({type:'promise', message:e.reason && e.reason.message});
    console.error('[PromiseError]', e.reason);
  });
  // 15秒加载保护
  window._loadGuard = setTimeout(function() {
    var el = document.getElementById('loading');
    if (el && el.style.display !== 'none') {
      el.innerHTML = '<p class="text-danger">加载超时</p><p class="text-muted small">请检查网络连接，或按 F5 刷新重试</p>' +
        '<button class="btn btn-primary btn-sm mt-2" onclick="location.reload()">刷新页面</button>';
    }
  }, 15000);
</script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container">
  <a class="navbar-brand" href="index.html">TeamMatch</a>
  <div class="ml-auto" id="nav-user-info">
    <a class="btn btn-outline-light btn-sm" href="login.html">登录</a>
  </div>
</div></nav>

<div class="container mt-4" id="app">
  <div id="loading" class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2">加载中...</p></div>
  <div id="errorBox" class="alert alert-danger" style="display:none"></div>
  <div id="content" style="display:none">
    <div class="row">
      <div class="col-md-8">
        <div class="card mb-3">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <h3 id="pName"></h3>
              <span id="pStatus" class="badge badge-lg"></span>
            </div>
            <p class="text-muted mt-2" id="pDesc"></p>
            <div class="row mt-3">
              <div class="col-6"><small class="text-muted">课程</small><br><strong id="pCourse"></strong></div>
              <div class="col-3"><small class="text-muted">人数</small><br><strong id="pMembers"></strong></div>
              <div class="col-3"><small class="text-muted">截止</small><br><strong id="pDeadline"></strong></div>
            </div>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-header">需求技能</div>
          <div class="card-body"><div id="requiredSkills"></div></div>
        </div>

        <div class="card mb-3">
          <div class="card-header">现有成员</div>
          <div class="card-body">
            <div class="row" id="memberList"></div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card mb-3">
          <div class="card-header">创建者</div>
          <div class="card-body"><h5 id="creatorName"></h5></div>
        </div>
        <div class="card">
          <div class="card-body text-center">
            <div id="applyArea">
              <button id="applyBtn" class="btn btn-primary btn-lg btn-block">申请入组</button>
              <p class="text-muted small mt-2" id="applyHint">登录后可申请</p>
            </div>
          </div>
        </div>
        <div class="mt-3" id="leaderLinks" style="display:none">
          <a id="linkApproval" class="btn btn-outline-warning btn-block mb-2">管理申请</a>
          <a id="linkProgress" class="btn btn-outline-info btn-block">进度看板</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 申请留言弹窗 -->
<div class="modal fade" id="applyModal">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">申请入组</h5><button class="close" data-dismiss="modal">&times;</button></div>
    <div class="modal-body">
      <textarea class="form-control" id="applyMessage" rows="3" placeholder="介绍一下你的技能和优势（选填）"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-dismiss="modal">取消</button>
      <button class="btn btn-primary" id="submitApply">提交申请</button>
    </div>
  </div></div>
</div>

<script src="lib/jquery.min.js"></script>
<script src="lib/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
(function() {
  'use strict';

  // 资源加载检测
  if (typeof $ === 'undefined') {
    document.getElementById('loading').innerHTML = '<p class="text-danger">页面资源加载失败（jQuery）</p><button class="btn btn-primary btn-sm mt-2" onclick="location.reload()">刷新</button>';
    return;
  }
  if (typeof window.TeamMatch === 'undefined') {
    document.getElementById('loading').innerHTML = '<p class="text-danger">页面资源加载失败（api.js）</p><button class="btn btn-primary btn-sm mt-2" onclick="location.reload()">刷新</button>';
    return;
  }

  var pid = new URLSearchParams(location.search).get('pid');
  if (!pid) {
    $('#loading').html('<p class="text-danger">缺少项目ID</p>');
    return;
  }

  var projectData = null;
  var currentUid = null;
  var retryCount = 0;
  var maxRetry = 2;

  var user = TeamMatch.util.getUser();
  currentUid = user ? user.uid : null;
  if (user) {
    $('#nav-user-info').html(
      '<span class="navbar-text mr-3 text-white">' + (user.nickname || '') + '</span>' +
      '<a class="btn btn-outline-light btn-sm" href="profile.html">个人中心</a>'
    );
  }

  // 启动加载
  loadDetail();

  async function loadDetail() {
    $('#loading').show().html('<div class="spinner-border text-primary"></div><p class="mt-2">加载中...</p>');
    $('#errorBox').hide();
    $('#content').hide();

    try {
      var res = await TeamMatch.projectApi.getDetail(pid);
      if (res.code !== 200 || !res.data) {
        showError(res.message || '项目不存在或已被删除');
        return;
      }
      projectData = res.data;
      renderDetail(projectData);
      clearTimeout(window._loadGuard);
      $('#loading').hide();
      $('#content').show();
    } catch (e) {
      console.error('[project] loadDetail error:', e);
      if (retryCount < maxRetry) {
        retryCount++;
        $('#loading').html('<p class="text-muted">加载失败，正在重试 (' + retryCount + '/' + maxRetry + ')...</p>');
        setTimeout(loadDetail, 1000);
        return;
      }
      showError(e.message || '网络异常，请检查服务器是否启动或刷新重试');
    }
  }

  function showError(msg) {
    clearTimeout(window._loadGuard);
    $('#loading').hide();
    $('#errorBox').text(msg).show();
    $('#content').hide();
  }

  function renderDetail(d) {
    try {
      $('#pName').text(d.pname || '未命名项目');
      $('#pDesc').text(d.description || '暂无描述');

      var course = d.course || {};
      $('#pCourse').text((course.cname || '') + (course.teacher ? ' - ' + course.teacher : ''));
      $('#pMembers').text((d.current_members || 0) + ' / ' + (d.max_members || 0));
      $('#pDeadline').text(d.deadline || '不限');

      var stMap = {0: '招募中', 1: '已满', 2: '进行中', 3: '已结束'};
      var stClass = {0: 'badge-success', 1: 'badge-warning', 2: 'badge-primary', 3: 'badge-secondary'};
      $('#pStatus').text(stMap[d.status] || '').removeClass('badge-success badge-warning badge-primary badge-secondary').addClass(stClass[d.status] || 'badge-secondary');

      var creator = d.creator || {};
      $('#creatorName').text(creator.nickname || '未知');

      // 需求技能
      var skills = d.required_skills || [];
      var skillHtml = '';
      skills.forEach(function(s) {
        skillHtml += '<span class="skill-tag skill-tech mr-1">' + (s.sname || '') + ' ×' + (s.required_count || 1) + '</span>';
      });
      $('#requiredSkills').html(skillHtml || '<span class="text-muted">无</span>');

      // 成员列表
      var members = d.members || [];
      var memHtml = '';
      members.forEach(function(m) {
        memHtml += '<div class="col-6 col-md-4 text-center mb-2"><div class="p-2">' +
          '<div class="font-weight-bold">' + (m.nickname || '未知') + '</div>' +
          '<small class="badge badge-' + (m.role === 'leader' ? 'warning' : 'info') + '">' + (m.role === 'leader' ? '组长' : '组员') + '</small>' +
          '</div></div>';
      });
      $('#memberList').html(memHtml || '<p class="text-muted">暂无成员</p>');

      // 申请按钮状态
      renderApplyButton(d);

      // 组长管理链接
      if (currentUid && creator.uid == currentUid) {
        $('#leaderLinks').show();
        $('#linkApproval').attr('href', 'approval.html?pid=' + pid);
        $('#linkProgress').attr('href', 'progress.html?pid=' + pid);
      } else {
        $('#leaderLinks').hide();
      }
    } catch (renderErr) {
      console.error('[project] renderDetail error:', renderErr);
      showError('页面渲染出错: ' + renderErr.message);
    }
  }

  function renderApplyButton(d) {
    var btn = $('#applyBtn');
    var hint = $('#applyHint');
    btn.removeClass('btn-primary btn-secondary btn-info btn-success').addClass('btn-primary').attr('disabled', false);

    if (!currentUid) {
      btn.text('请先登录').attr('disabled', true).removeClass('btn-primary').addClass('btn-secondary');
      hint.text('登录后可申请');
      return;
    }
    hint.hide();

    var creator = d.creator || {};
    if (creator.uid == currentUid) {
      btn.text('这是你的项目').attr('disabled', true).removeClass('btn-primary').addClass('btn-secondary');
      return;
    }

    var appStatus = d.my_application_status;
    if (appStatus === 0) {
      btn.text('审核中').attr('disabled', true).removeClass('btn-primary').addClass('btn-info');
    } else if (appStatus === 1) {
      btn.text('已加入').attr('disabled', true).removeClass('btn-primary').addClass('btn-success');
    } else if (d.status !== 0) {
      btn.text('已结束招募').attr('disabled', true).removeClass('btn-primary').addClass('btn-secondary');
    } else {
      btn.text('申请入组');
    }
  }

  $('#applyBtn').on('click', function() {
    if (!currentUid) { location.href = 'login.html'; return; }
    $('#applyModal').modal('show');
  });

  $('#submitApply').on('click', async function() {
    var msg = $('#applyMessage').val().trim() || undefined;
    var btn = $(this);
    btn.prop('disabled', true).text('提交中...');
    try {
      var res = await TeamMatch.projectApi.apply(pid, msg);
      if (res.code === 200) {
        TeamMatch.util.showToast('申请已提交！', 'success');
        $('#applyModal').modal('hide');
        $('#applyBtn').text('审核中').attr('disabled', true).removeClass('btn-primary').addClass('btn-info');
      } else {
        TeamMatch.util.showToast(res.message, 'error');
      }
    } catch (e) {
      TeamMatch.util.showToast(e.message || '网络错误', 'error');
    }
    btn.prop('disabled', false).text('提交申请');
  });
})();
</script>
</body>
</html>
