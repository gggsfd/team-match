<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - TeamMatch</title>
<link rel="stylesheet" href="lib/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
  <div class="card">
    <div class="card-header bg-success text-white text-center py-3">
      <h4 class="mb-0">创建账号</h4>
    </div>
    <div class="card-body px-4 py-4">
      <div class="mb-3">
        <a href="index.html" class="btn btn-outline-secondary btn-sm">&larr; 返回首页</a>
      </div>
      <form id="registerForm">
        <div class="form-group">
          <label>学号 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="username" placeholder="学号作为登录账号" required>
        </div>
        <div class="form-group">
          <label>密码 <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="password" placeholder="6-20位密码" required minlength="6" maxlength="20">
        </div>
        <div class="form-group">
          <label>昵称 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="nickname" placeholder="显示名称" required>
        </div>
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" class="form-control" id="email" placeholder="选填">
        </div>
        <div class="form-group">
          <label>手机号</label>
          <input type="text" class="form-control" id="phone" placeholder="选填">
        </div>
        <button type="submit" class="btn btn-success btn-block mt-3">注册</button>
      </form>
      <p class="text-center mt-3 mb-0"><a href="login.html">已有账号？去登录</a></p>
    </div>
  </div>
</div>

<script src="lib/jquery.min.js"></script>
<script src="js/api.js"></script>
<script>
$('#registerForm').on('submit', async function(e) {
  e.preventDefault();
  var btn = $(this).find('button');
  btn.prop('disabled', true).text('注册中..');

  var pw = $('#password').val();
  if (pw.length < 6 || pw.length > 20) {
    TeamMatch.util.showToast('密码长度需在6-20位之间', 'error');
    btn.prop('disabled', false).text('注册');
    return;
  }

  try {
    var res = await TeamMatch.userApi.register({
      username: $('#username').val().trim(),
      password: pw,
      nickname: $('#nickname').val().trim(),
      email: $('#email').val().trim() || undefined,
      phone: $('#phone').val().trim() || undefined
    });
    if (res.code === 200) {
      TeamMatch.util.showToast('注册成功！请登录', 'success');
      setTimeout(function() { window.location.href = 'login.html'; }, 800);
    } else {
      TeamMatch.util.showToast(res.message, 'error');
    }
  } catch (err) {
    TeamMatch.util.showToast('网络错误，请重试', 'error');
  }
  btn.prop('disabled', false).text('注册');
});
</script>
</body>
</html>
