<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamMatch - 进度看板</title>
    <link rel="stylesheet" href="lib/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-4">
        <!-- 面包屑 -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">首页</a></li>
                <li class="breadcrumb-item"><a href="#" id="projectLink">项目详情</a></li>
                <li class="breadcrumb-item active">进度看板</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 id="projectTitle">项目进度</h3>
            <button class="btn btn-primary" id="addNodeBtn" style="display:none;">+ 添加节点</button>
        </div>

        <div id="loadingState" class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">加载中...</span>
            </div>
        </div>

        <div id="contentArea" style="display:none;">
            <div class="card">
                <div class="card-body">
                    <div id="progressList" class="timeline">
                        <!-- 动态加载 -->
                    </div>

                    <div id="emptyState" class="empty-state" style="display:none;">
                        <div class="empty-icon">&#128200;</div>
                        <h4>暂无进度节点</h4>
                        <p>组长可以添加项目进度节点</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加节点Modal -->
    <div class="modal fade" id="addNodeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">添加进度节点</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="addNodeForm">
                        <div class="form-group">
                            <label for="nodeTitle">节点标题 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nodeTitle" placeholder="例如：需求分析完成" required>
                        </div>
                        <div class="form-group">
                            <label for="nodeDesc">节点描述</label>
                            <textarea class="form-control" id="nodeDesc" rows="3" placeholder="描述该节点的具体内容..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="nodeDeadline">截止日期</label>
                            <input type="date" class="form-control" id="nodeDeadline">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="confirmAddNode">添加</button>
                </div>
            </div>
        </div>
    </div>

    <script src="lib/jquery.min.js"></script>
    <script src="lib/bootstrap.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        $(function() {
            TeamMatch.util.initNavbar('');

            if (!TeamMatch.util.requireLogin()) return;

            var pid = TeamMatch.util.getQueryParam('pid');
            var isLeader = false;

            if (!pid) {
                TeamMatch.util.showToast('项目ID无效', 'error');
                window.location.href = 'index.html';
                return;
            }

            // 检查权限并加载数据
            function initPage() {
                TeamMatch.projectApi.getDetail(pid).then(function(res) {
                    if (res.code === 200 && res.data) {
                        var user = TeamMatch.util.getUser();
                        isLeader = res.data.creator && res.data.creator.uid === user.uid;

                        $('#projectTitle').text(res.data.pname + ' - 进度看板');
                        $('#projectLink').attr('href', 'project.html?pid=' + pid);

                        if (isLeader) {
                            $('#addNodeBtn').show();
                        }

                        loadProgress();
                    } else {
                        TeamMatch.util.showToast('项目不存在', 'error');
                        window.location.href = 'index.html';
                    }
                }).catch(function() {
                    $('#loadingState').hide();
                    TeamMatch.util.showToast('加载失败', 'error');
                });
            }

            // 加载进度列表
            function loadProgress() {
                TeamMatch.projectApi.getProgress(pid).then(function(res) {
                    $('#loadingState').hide();
                    $('#contentArea').show();

                    if (res.code === 200 && res.data && res.data.length > 0) {
                        renderProgress(res.data);
                    } else {
                        $('#emptyState').show();
                    }
                }).catch(function() {
                    $('#loadingState').hide();
                    $('#contentArea').show();
                    $('#emptyState').show();
                });
            }

            // 渲染进度列表
            function renderProgress(nodes) {
                var html = '';
                nodes.forEach(function(node) {
                    var isCompleted = node.status === 1;
                    var statusClass = isCompleted ? 'completed' : '';
                    var statusBadge = isCompleted ?
                        '<span class="badge badge-success">已完成</span>' :
                        '<span class="badge badge-secondary">待完成</span>';

                    var actionBtn = '';
                    if (isLeader) {
                        if (isCompleted) {
                            actionBtn = '<button class="btn btn-sm btn-outline-secondary toggle-status-btn" data-prid="' + node.prid + '" data-status="0">标记为未完成</button>';
                        } else {
                            actionBtn = '<button class="btn btn-sm btn-success toggle-status-btn" data-prid="' + node.prid + '" data-status="1">标记完成</button>';
                        }
                    }

                    html += '<div class="timeline-item ' + statusClass + '">' +
                        '<div class="d-flex justify-content-between align-items-start">' +
                        '<div class="timeline-title">' + node.title + ' ' + statusBadge + '</div>' +
                        '<div>' + actionBtn + '</div>' +
                        '</div>' +
                        '<div class="timeline-desc">' + (node.description || '无描述') + '</div>' +
                        '<div class="timeline-meta">' +
                        (node.deadline ? '截止: ' + TeamMatch.util.formatDate(node.deadline) + ' | ' : '') +
                        '创建: ' + TeamMatch.util.formatDate(node.created_at) +
                        '</div></div>';
                });
                $('#progressList').html(html);

                // 绑定状态切换事件
                $('.toggle-status-btn').on('click', function() {
                    var prid = $(this).data('prid');
                    var status = $(this).data('status');
                    updateNodeStatus(prid, status);
                });
            }

            // 更新节点状态
            function updateNodeStatus(prid, status) {
                TeamMatch.projectApi.updateProgress(pid, {
                    prid: prid,
                    status: status
                }).then(function(res) {
                    if (res.code === 200) {
                        TeamMatch.util.showToast('状态更新成功', 'success');
                        loadProgress();
                    } else {
                        TeamMatch.util.showToast(res.message || '更新失败', 'error');
                    }
                }).catch(function() {
                    TeamMatch.util.showToast('更新失败', 'error');
                });
            }

            // 添加节点按钮
            $('#addNodeBtn').on('click', function() {
                $('#addNodeModal').modal('show');
            });

            // 确认添加节点
            $('#confirmAddNode').on('click', function() {
                var title = $('#nodeTitle').val().trim();
                var description = $('#nodeDesc').val().trim();
                var deadline = $('#nodeDeadline').val();

                if (!title) {
                    TeamMatch.util.showToast('请输入节点标题', 'error');
                    return;
                }

                var data = { title: title };
                if (description) data.description = description;
                if (deadline) data.deadline = deadline;

                TeamMatch.projectApi.addProgress(pid, data).then(function(res) {
                    if (res.code === 200) {
                        $('#addNodeModal').modal('hide');
                        $('#addNodeForm')[0].reset();
                        TeamMatch.util.showToast('节点添加成功', 'success');
                        loadProgress();
                    } else {
                        TeamMatch.util.showToast(res.message || '添加失败', 'error');
                    }
                }).catch(function() {
                    TeamMatch.util.showToast('添加失败', 'error');
                });
            });

            // 初始化
            initPage();
        });
    </script>
</body>
</html>
