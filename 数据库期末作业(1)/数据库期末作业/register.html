<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamMatch - 注册</title>
    <link rel="stylesheet" href="lib/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2 class="card-title">注册账号</h2>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">学号 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="请输入学号" required>
                </div>
                <div class="form-group">
                    <label for="password">密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="6-20位密码" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="再次输入密码" required>
                </div>
                <div class="form-group">
                    <label for="nickname">昵称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="nickname" name="nickname" placeholder="请输入昵称" required>
                </div>
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="选填">
                </div>
                <div class="form-group">
                    <label for="phone">手机号</label>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="选填">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">注册</button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted">已有账号？</span>
                <a href="login.html">去登录</a>
            </div>
        </div>
    </div>

    <script src="lib/jquery.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        $(function() {
            // 如果已登录，跳转到首页
            if (TeamMatch.util.getToken()) {
                window.location.href = 'index.html';
                return;
            }

            $('#registerForm').on('submit', function(e) {
                e.preventDefault();

                var username = $('#username').val().trim();
                var password = $('#password').val();
                var confirmPassword = $('#confirmPassword').val();
                var nickname = $('#nickname').val().trim();
                var email = $('#email').val().trim();
                var phone = $('#phone').val().trim();

                if (!username || !password || !nickname) {
                    TeamMatch.util.showToast('请填写必填项', 'error');
                    return;
                }

                if (password.length < 6 || password.length > 20) {
                    TeamMatch.util.showToast('密码长度需在6-20位之间', 'error');
                    return;
                }

                if (password !== confirmPassword) {
                    TeamMatch.util.showToast('两次输入的密码不一致', 'error');
                    return;
                }

                var data = {
                    username: username,
                    password: password,
                    nickname: nickname
                };
                if (email) data.email = email;
                if (phone) data.phone = phone;

                TeamMatch.userApi.register(data).then(function(res) {
                    if (res.code === 200) {
                        TeamMatch.util.showToast('注册成功，请登录', 'success');
                        setTimeout(function() {
                            window.location.href = 'login.html';
                        }, 1000);
                    } else {
                        TeamMatch.util.showToast(res.message || '注册失败', 'error');
                    }
                }).catch(function(err) {
                    console.error(err);
                });
            });
        });
    </script>
</body>
</html>
