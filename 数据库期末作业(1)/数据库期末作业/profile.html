<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamMatch - 个人中心</title>
    <link rel="stylesheet" href="lib/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <!-- 左侧个人信息 -->
            <div class="col-lg-3">
                <div class="card profile-sidebar">
                    <div class="avatar-circle avatar-circle-lg" id="profileAvatar"></div>
                    <div class="profile-name" id="profileName"></div>
                    <div class="profile-username" id="profileUsername"></div>
                    <div class="profile-meta" id="profileMeta"></div>
                </div>
            </div>

            <!-- 右侧标签页 -->
            <div class="col-lg-9">
                <div class="card">
                    <div class="card-body">
                        <ul class="nav nav-tabs" id="profileTabs">
                            <li class="nav-item">
                                <a class="nav-link active" data-toggle="tab" href="#skillsTab">我的技能</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-toggle="tab" href="#projectsTab">我的项目</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-toggle="tab" href="#editTab">编辑资料</a>
                            </li>
                        </ul>

                        <div class="tab-content mt-4">
                            <!-- 我的技能 -->
                            <div class="tab-pane fade show active" id="skillsTab">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h5>我的技能</h5>
                                    <button class="btn btn-sm btn-primary" id="addSkillBtn">+ 添加技能</button>
                                </div>
                                <div id="skillList"></div>
                                <div id="skillEmpty" class="empty-state" style="display:none; padding:30px;">
                                    <p class="text-muted">还没有添加技能，快去添加吧！</p>
                                </div>

                                <!-- 添加技能表单 -->
                                <div id="addSkillForm" class="card bg-light p-3 mt-3" style="display:none;">
                                    <h6>添加新技能</h6>
                                    <div class="form-row">
                                        <div class="col-md-5">
                                            <select class="form-control" id="newSkillSelect">
                                                <option value="">选择技能</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <select class="form-control" id="newProficiency">
                                                <option value="1">&#9733; 入门</option>
                                                <option value="2">&#9733;&#9733; 初级</option>
                                                <option value="3">&#9733;&#9733;&#9733; 中级</option>
                                                <option value="4">&#9733;&#9733;&#9733;&#9733; 高级</option>
                                                <option value="5">&#9733;&#9733;&#9733;&#9733;&#9733; 精通</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3">
                                            <button class="btn btn-primary btn-block" id="confirmAddSkill">添加</button>
                                        </div>
                                    </div>
                                    <button class="btn btn-sm btn-link text-muted mt-2" id="cancelAddSkill">取消</button>
                                </div>
                            </div>

                            <!-- 我的项目 -->
                            <div class="tab-pane fade" id="projectsTab">
                                <h5 class="mb-3">我创建的项目</h5>
                                <div id="myCreatedProjects"></div>
                                <div id="createdEmpty" class="text-muted mb-4" style="display:none;">暂无创建的项目</div>

                                <h5 class="mb-3 mt-4">我加入的项目</h5>
                                <div id="myJoinedProjects"></div>
                                <div id="joinedEmpty" class="text-muted" style="display:none;">暂无加入的项目</div>
                            </div>

                            <!-- 编辑资料 -->
                            <div class="tab-pane fade" id="editTab">
                                <h5 class="mb-3">编辑个人资料</h5>
                                <form id="editProfileForm">
                                    <div class="form-group">
                                        <label>昵称</label>
                                        <input type="text" class="form-control" id="editNickname">
                                    </div>
                                    <div class="form-group">
                                        <label>邮箱</label>
                                        <input type="email" class="form-control" id="editEmail">
                                    </div>
                                    <div class="form-group">
                                        <label>手机号</label>
                                        <input type="tel" class="form-control" id="editPhone">
                                    </div>
                                    <button type="submit" class="btn btn-primary">保存修改</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="lib/jquery.min.js"></script>
    <script src="lib/bootstrap.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        $(function() {
            TeamMatch.util.initNavbar('profile');

            if (!TeamMatch.util.requireLogin()) return;

            var profileData = null;

            // 加载个人资料
            function loadProfile() {
                TeamMatch.userApi.getProfile().then(function(res) {
                    if (res.code === 200 && res.data) {
                        profileData = res.data;
                        renderProfile(res.data);
                        renderSkills(res.data.skills);
                        renderProjects(res.data.projects);
                        fillEditForm(res.data);
                    }
                });
            }

            // 渲染个人信息侧边栏
            function renderProfile(data) {
                var initial = data.nickname ? data.nickname.charAt(0) : '?';
                $('#profileAvatar').text(initial);
                $('#profileName').text(data.nickname);
                $('#profileUsername').text('学号: ' + data.username);

                var metaHtml = '<div><strong>邮箱:</strong> ' + (data.email || '未设置') + '</div>' +
                    '<div><strong>手机:</strong> ' + (data.phone || '未设置') + '</div>' +
                    '<div><strong>信用分:</strong> ' + data.credit_score + '</div>' +
                    '<div><strong>注册时间:</strong> ' + TeamMatch.util.formatDate(data.created_at) + '</div>';
                $('#profileMeta').html(metaHtml);
            }

            // 渲染技能列表
            function renderSkills(skills) {
                if (!skills || skills.length === 0) {
                    $('#skillList').hide();
                    $('#skillEmpty').show();
                    return;
                }

                $('#skillEmpty').hide();
                var html = '<div class="list-group">';
                skills.forEach(function(s) {
                    var categoryClass = TeamMatch.util.skillCategoryMap[s.category] || 'badge-secondary';
                    html += '<div class="list-group-item d-flex justify-content-between align-items-center">' +
                        '<div>' +
                        '<span class="badge ' + categoryClass + ' mr-2">' + s.category + '</span>' +
                        '<strong>' + s.sname + '</strong>' +
                        '<span class="star-rating ml-2">' + TeamMatch.util.renderStars(s.proficiency) + '</span>' +
                        '</div>' +
                        '<button class="btn btn-sm btn-outline-danger remove-skill-btn" data-sid="' + s.sid + '">删除</button>' +
                        '</div>';
                });
                html += '</div>';
                $('#skillList').html(html).show();

                // 绑定删除事件
                $('.remove-skill-btn').on('click', function() {
                    var sid = $(this).data('sid');
                    if (confirm('确定要删除这个技能吗？')) {
                        TeamMatch.userApi.removeSkill(sid).then(function(res) {
                            if (res.code === 200) {
                                TeamMatch.util.showToast('技能已删除', 'success');
                                loadProfile();
                            } else {
                                TeamMatch.util.showToast(res.message || '删除失败', 'error');
                            }
                        });
                    }
                });
            }

            // 渲染项目列表
            function renderProjects(projects) {
                var created = [];
                var joined = [];

                if (projects) {
                    projects.forEach(function(p) {
                        if (p.role === 'leader') {
                            created.push(p);
                        } else {
                            joined.push(p);
                        }
                    });
                }

                // 创建的项目
                if (created.length === 0) {
                    $('#myCreatedProjects').hide();
                    $('#createdEmpty').show();
                } else {
                    $('#createdEmpty').hide();
                    var html = '<div class="list-group">';
                    created.forEach(function(p) {
                        var statusInfo = TeamMatch.util.projectStatusMap[p.status] || { text: '未知', class: 'badge-secondary' };
                        html += '<a href="project.html?pid=' + p.pid + '" class="list-group-item list-group-item-action">' +
                            '<div class="d-flex justify-content-between">' +
                            '<span>' + p.pname + '</span>' +
                            '<span class="badge ' + statusInfo.class + '">' + statusInfo.text + '</span>' +
                            '</div></a>';
                    });
                    html += '</div>';
                    $('#myCreatedProjects').html(html).show();
                }

                // 加入的项目
                if (joined.length === 0) {
                    $('#myJoinedProjects').hide();
                    $('#joinedEmpty').show();
                } else {
                    $('#joinedEmpty').hide();
                    var html = '<div class="list-group">';
                    joined.forEach(function(p) {
                        var statusInfo = TeamMatch.util.projectStatusMap[p.status] || { text: '未知', class: 'badge-secondary' };
                        html += '<a href="project.html?pid=' + p.pid + '" class="list-group-item list-group-item-action">' +
                            '<div class="d-flex justify-content-between">' +
                            '<span>' + p.pname + '</span>' +
                            '<span class="badge ' + statusInfo.class + '">' + statusInfo.text + '</span>' +
                            '</div></a>';
                    });
                    html += '</div>';
                    $('#myJoinedProjects').html(html).show();
                }
            }

            // 填充编辑表单
            function fillEditForm(data) {
                $('#editNickname').val(data.nickname);
                $('#editEmail').val(data.email || '');
                $('#editPhone').val(data.phone || '');
            }

            // 加载可选技能列表（排除已有的）
            function loadAvailableSkills() {
                var mySkillIds = [];
                if (profileData && profileData.skills) {
                    profileData.skills.forEach(function(s) {
                        mySkillIds.push(s.sid);
                    });
                }

                var html = '<option value="">选择技能</option>';
                TeamMatch.util.skillList.forEach(function(skill) {
                    if (mySkillIds.indexOf(skill.sid) === -1) {
                        html += '<option value="' + skill.sid + '">' + skill.sname + '</option>';
                    }
                });
                $('#newSkillSelect').html(html);
            }

            // 添加技能按钮
            $('#addSkillBtn').on('click', function() {
                loadAvailableSkills();
                $('#addSkillForm').show();
            });

            // 取消添加
            $('#cancelAddSkill').on('click', function() {
                $('#addSkillForm').hide();
            });

            // 确认添加技能
            $('#confirmAddSkill').on('click', function() {
                var sid = $('#newSkillSelect').val();
                var proficiency = $('#newProficiency').val();

                if (!sid) {
                    TeamMatch.util.showToast('请选择技能', 'error');
                    return;
                }

                TeamMatch.userApi.addSkill(parseInt(sid), parseInt(proficiency)).then(function(res) {
                    if (res.code === 200) {
                        TeamMatch.util.showToast('技能添加成功', 'success');
                        $('#addSkillForm').hide();
                        loadProfile();
                    } else {
                        TeamMatch.util.showToast(res.message || '添加失败', 'error');
                    }
                });
            });

            // 编辑资料表单
            $('#editProfileForm').on('submit', function(e) {
                e.preventDefault();

                var data = {};
                var nickname = $('#editNickname').val().trim();
                var email = $('#editEmail').val().trim();
                var phone = $('#editPhone').val().trim();

                if (nickname) data.nickname = nickname;
                if (email) data.email = email;
                if (phone) data.phone = phone;

                if (Object.keys(data).length === 0) {
                    TeamMatch.util.showToast('没有要修改的内容', 'info');
                    return;
                }

                TeamMatch.userApi.updateProfile(data).then(function(res) {
                    if (res.code === 200) {
                        TeamMatch.util.showToast('资料更新成功', 'success');
                        // 更新localStorage中的用户信息
                        var user = TeamMatch.util.getUser();
                        if (user) {
                            if (data.nickname) user.nickname = data.nickname;
                            localStorage.setItem('user', JSON.stringify(user));
                        }
                        loadProfile();
                    } else {
                        TeamMatch.util.showToast(res.message || '更新失败', 'error');
                    }
                });
            });

            // 初始化
            loadProfile();
        });
    </script>
</body>
</html>
